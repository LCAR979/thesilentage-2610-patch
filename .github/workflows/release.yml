name: Build release
on:
  push:
    tags: ['v1.1.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build verified release archive
        run: python tools/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: TheSilentAge-v1.1.0
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --title "中文 2610 补丁 v1.1.0：译文修正、加速与结局恢复工具"
          --notes-file docs/使用说明-v1.1.0.txt
